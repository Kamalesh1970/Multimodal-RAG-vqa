[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    ocr: tests requiring the real PaddleOCR engine
    gemini: tests requiring the real Gemini API
    openai: tests requiring the real OpenAI API
    simulated: tests using local VLM simulator
    live_vlm: tests using real VLM endpoints

